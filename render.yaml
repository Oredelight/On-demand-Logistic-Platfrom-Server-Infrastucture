services:
  - type: web
    name: delifoods-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        value: change-me-in-production
      - key: ALLOWED_ORIGINS
        value: https://delifoods-frontend.onrender.com
      - key: FRONTEND_URL

    databaseName: delifoods
    user: delifoods
