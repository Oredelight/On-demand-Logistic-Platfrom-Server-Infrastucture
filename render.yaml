services:
  - type: web
    name: delifoods-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        value: change-me-in-production
      - key: ALLOWED_ORIGINS
        value: https://delifoods-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://delifoods-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: delifoods-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: delifoods-redis
          property: connectionString

  - type: static
    name: delifoods-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://delifoods-backend.onrender.com

  - type: worker
    name: delifoods-worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A workers.celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        value: change-me-in-production
      - key: DATABASE_URL
        fromDatabase:
          name: delifoods-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: delifoods-redis
          property: connectionString

  - type: redis
    name: delifoods-redis
    plan: free

databases:
  - name: delifoods-db
    plan: free
    databaseName: delifoods
    user: delifoods
